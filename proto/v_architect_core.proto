syntax = "proto3";

package v_architect_core_pb; // Package name for generated Go code

option go_package = "github.com/V-Architect/v-architect-core/core_engine/pb"; // Adjust to actual Go module path

// --- VM Configuration Structures (mirroring vm_config_schema.json concepts) ---

message VCPUConfig {
  uint32 count = 1;
  message Topology {
    uint32 sockets = 1;
    uint32 cores_per_socket = 2;
    uint32 threads_per_core = 3;
  }
  Topology topology = 2;
  repeated string cpu_features_passthrough = 3;
  // bool hide_hypervisor_id_from_guest = 4; // Example of a CPU feature toggle
}

message VRAMConfig {
  uint64 size_mb = 1;
  bool memory_ballooning_enabled = 2;
  message AIOptimizedFlags {
    bool prefer_contiguous = 1;
    uint32 numa_node_affinity = 2; // 0 if no specific affinity, or specific node ID
  }
  AIOptimizedFlags ai_optimized_flags = 3;
}

message StorageDevice {
  string disk_id = 1;
  string image_path = 2;
  enum ControllerType {
    CONTROLLER_TYPE_UNSPECIFIED = 0;
    VIRTIO_BLK = 1;
    VIRTIO_SCSI = 2;
    NVME = 3;
    SATA = 4;
    IDE = 5;
  }
  ControllerType controller_type = 3;
  uint64 size_gb = 4; // Used if creating a new disk
  bool is_boot_disk = 5;
  bool read_only = 6;
  enum ImageFormat {
    IMAGE_FORMAT_UNSPECIFIED = 0;
    QCOW2 = 1;
    RAW = 2;
    VMDK = 3;
  }
  ImageFormat format = 7;
  string serial_number = 8; // Optional device serial
  // Add io_priority, throttling limits here if managed per device
}

message NetworkInterface {
  string nic_id = 1;
  string mac_address = 2; // Optional, auto-generated if empty
  enum VNICModel {
    VNIC_MODEL_UNSPECIFIED = 0;
    VIRTIO_NET = 1;
    E1000 = 2; // Example legacy
  }
  VNICModel vnic_model = 3;
  string network_attachment_id = 4; // ID of vSwitch, AI Switch, or predefined network like "default_nat_bridge"
  // string ip_address_static = 5; // Optional static IP
  // string gateway_static = 6;    // Optional static gateway
}

message GraphicsConfig {
  enum GraphicsType {
    GRAPHICS_TYPE_UNSPECIFIED = 0;
    VGA_COMPATIBLE = 1;       // Basic emulated VGA
    VIRTIO_GPU = 2;           // Paravirtualized GPU
    GPU_PASSTHROUGH = 3;      // Direct device assignment
    MEDIATED_VGPU = 4;        // Vendor vGPU profiles
  }
  GraphicsType type = 1;
  string vgpu_profile_or_physical_id = 2; // e.g., "nvidia_a100_mig_1g.10gb" or host PCIe BDF "0000:01:00.0"
  uint32 display_resolution_width = 3; // Optional hint
  uint32 display_resolution_height = 4; // Optional hint
}

message PCIPassthroughDevice {
     string host_pci_address = 1; // BDF format, e.g., "0000:01:00.0"
     string iommu_group_path = 2; // e.g., "/dev/vfio/10" - for VFIO assignment
     // string guest_alias = 3; // Optional alias for guest OS
}

message AICPUConfig { // For vNPU/vTPU
     enum AIType {
         AI_TYPE_UNSPECIFIED = 0;
         PASSTHROUGH = 1;
         MEDIATED = 2;
         SOFTWARE_EMULATED = 3;
     }
     AIType type = 1;
     string physical_device_id = 2; // Host PCIe BDF for passthrough
     string mediated_profile_name = 3; // For mediated (vendor-specific)
     enum EmulatedPerformanceTier {
         TIER_UNSPECIFIED = 0; LOW = 1; MEDIUM = 2; HIGH = 3;
     }
     EmulatedPerformanceTier emulated_performance_tier = 4;
     uint32 num_virtual_devices = 5; // If one physical can be exposed as multiple virtual ones
}

message AIGraphicsCardConfig { // For vAI-GPU/NPU
     enum AIGfxType {
         AI_GFX_TYPE_UNSPECIFIED = 0;
         PASSTHROUGH = 1;
         MEDIATED_VGPU = 2; // Using vendor vGPU tech for AI
     }
     AIGfxType type = 1;
     string physical_device_id = 2; // Host PCIe BDF for passthrough
     string vendor_specific_profile_id = 3; // e.g., "nvidia_a100_20g_ai_profile"
     uint64 dedicated_memory_mb = 4; // Often implied by profile
}

message AIAcceleratedHardware {
  AICPUConfig ai_cpu_config = 1;
  AIGraphicsCardConfig ai_graphics_card_config = 2;
  // AI RAM config is part of VRAMConfig.AIOptimizedFlags
  // AI Switches/Routers are part of NetworkInterface attachment details or global network config
}

message SerialPortConfig {
     enum SerialPortType {
         SERIAL_TYPE_UNSPECIFIED = 0;
         PTY = 1;         // Host PTY
         TCP_SOCKET = 2;  // TCP socket (server or client mode)
         NAMED_PIPE = 3;  // Host named pipe
         FILE = 4;        // Output to a host file
     }
     SerialPortType type = 1;
     string path_or_address = 2; // e.g., "/dev/pts/X", "localhost:1234", "/tmp/vmserial.sock"
     uint32 io_base_address_override = 3; // Optional: if 0, use default (e.g. 0x3F8 for first, 0x2F8 for second)
     string id = 4; // Optional: user defined ID for this serial port, e.g. "com1", "debug_port"
}

message VMConfig {
  string vm_id = 1;        // Unique ID (UUID recommended)
  string vm_name = 2;
  string description = 3;
  string os_type = 4;      // e.g., "windows_11_x64", "ubuntu_server_22.04_x64" (links to supported_os_metadata.json)
  string architecture = 5; // "x86-64", "arm64"

  VCPUConfig vcpu_config = 6;
  VRAMConfig vram_config = 7;
  repeated StorageDevice storage_devices = 8;
  repeated NetworkInterface network_interfaces = 9;
  GraphicsConfig graphics_config = 10;
  repeated PCIPassthroughDevice pci_passthrough_devices = 11;
  AIAcceleratedHardware ai_accelerated_hardware = 12;

  repeated string boot_order = 13; // List of disk_id or nic_id (for PXE)
  string firmware_type = 14;      // "bios", "uefi"
  bool secure_boot_enabled = 15; // Requires UEFI
  bool virtual_tpm_enabled = 16; // TPM 2.0
  repeated SerialPortConfig serial_ports = 17;

  // map<string, string> custom_tags = 18; // For user-defined tags, AI workload hints etc.
  // string security_policy_id = 19; // Link to a SecurityPolicy object
}

// --- Service Messages ---
// (Includes messages from previous conceptual implementation:
// GetEngineInfoRequest, GetEngineInfoResponse, HealthCheckRequest, HealthCheckResponse,
// ConfigureEngineRequest, ConfigureEngineResponse, GetHostCapabilitiesRequest, HostCapabilities,
// CreateVMRequest, CreateVMResponse, etc.
// Plus new ones for HotPlug/Unplug CPU/Memory from Phase 1 Tech Spec IV.B)

 message GetEngineInfoRequest {}
 message GetEngineInfoResponse {
     string engine_version = 1;
     string api_version = 2;
     repeated string supported_vm_architectures = 3;
 }

 message HealthCheckRequest {}
 message HealthCheckResponse {
     enum Status { HEALTHY = 0; DEGRADED = 1; UNHEALTHY = 2; }
     Status status = 1;
     string message = 2;
 }

 message ConfigureEngineRequest {
     string log_level = 1;
     string default_storage_path = 2;
 }
 message ConfigureEngineResponse {
     bool success = 1;
     string message = 2;
 }

 message GetHostCapabilitiesRequest {}
 message HostCapabilities {
     message CPUInfo {
         string model_string = 1;
         uint32 core_count = 2;
         uint32 thread_count = 3;
         repeated string supported_virtualization_extensions = 4;
     }
     CPUInfo cpu_info = 1;
     uint64 total_memory_gb = 2;
     uint64 available_memory_gb = 3;
     message StoragePoolInfo {
         string pool_id = 1;
         string path = 2;
         uint64 total_space_gb = 3;
         uint64 available_space_gb = 4;
     }
     repeated StoragePoolInfo storage_pools = 4;
     message GPUInfo {
         string gpu_id = 1;
         string model_name = 2;
         uint64 memory_mb = 3;
         bool passthrough_capable = 4;
         repeated string vgpu_profiles_supported = 5;
     }
     repeated GPUInfo detected_gpus = 5;
     message AIAcceleratorInfo {
         string accelerator_id = 1;
         string type = 2;
         string model_name = 3;
     }
     repeated AIAcceleratorInfo detected_ai_accelerators = 6;
 }

 message CreateVMRequest {
     string vm_id_suggestion = 1; // User can suggest, Core Engine can override/generate if empty
     VMConfig vm_config = 2;
 }
 message CreateVMResponse {
     string vm_id = 1; // Final vm_id
     enum Status { SUCCESS = 0; FAILED_VALIDATION = 1; FAILED_CREATION = 2; ALREADY_EXISTS = 3; }
     Status status = 2;
     string message = 3;
 }

 // Placeholder for other VMService RPC messages (Delete, Start, Stop, etc.)
 // For example:
 message StartVMRequest { string vm_id = 1; }
 message StartVMResponse { enum Status { SUCCESS = 0; FAILED = 1; NOT_FOUND = 2; ALREADY_RUNNING = 3;} Status status = 1; string message = 2; }
 message StopVMRequest { string vm_id = 1; bool force = 2; } // force for power-off
 message StopVMResponse { enum Status { SUCCESS = 0; FAILED = 1; NOT_FOUND = 2; NOT_RUNNING = 3;} Status status = 1; string message = 2; }
 // ... and so on for Pause, Resume, GetVMStatus, UpdateVMConfiguration, ListVMs, ManageVMMedia

 // HotPlug RPCs
 message HotPlugVCPURequest { string vm_id = 1; uint32 num_vcpus_to_add = 2;}
 message HotPlugVCPUResponse { enum Status { SUCCESS = 0; FAILED = 1; PARTIALLY_COMPLETED = 2; VM_NOT_RUNNING = 3; NOT_SUPPORTED_BY_GUEST_OS = 4; MAX_VCPUS_REACHED = 5; } Status status = 1; string message = 2; uint32 current_vcpu_count = 3; uint32 added_vcpu_count = 4;}
 message HotUnplugVCPURequest { string vm_id = 1; uint32 num_vcpus_to_remove = 2;}
 message HotUnplugVCPUResponse { enum Status { SUCCESS = 0; FAILED = 1; PARTIALLY_COMPLETED = 2; VM_NOT_RUNNING = 3; NOT_SUPPORTED_BY_GUEST_OS = 4; MIN_VCPUS_REACHED = 5; VCPU_BUSY = 6;} Status status = 1; string message = 2; uint32 current_vcpu_count = 3; uint32 removed_vcpu_count = 4;}
 message HotAddMemoryRequest { string vm_id = 1; uint64 memory_mb_to_add = 2;}
 message HotAddMemoryResponse { enum Status { SUCCESS = 0; FAILED = 1; VM_NOT_RUNNING = 3; NOT_SUPPORTED_BY_GUEST_OS = 4; MAX_MEMORY_REACHED = 5; } Status status = 1; string message = 2; uint64 current_memory_mb = 3; uint64 added_memory_mb = 4;}
 message HotRemoveMemoryRequest { string vm_id = 1; uint64 memory_mb_to_remove = 2;}
 message HotRemoveMemoryResponse { enum Status { SUCCESS = 0; FAILED = 1; NOT_SUPPORTED = 2; VM_NOT_RUNNING = 3; } Status status = 1; string message = 2; uint64 current_memory_mb = 3; uint64 removed_memory_mb = 4;}


// --- Services ---
service CoreHypervisorService {
  rpc GetEngineInfo(GetEngineInfoRequest) returns (GetEngineInfoResponse);
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
  rpc ConfigureEngine(ConfigureEngineRequest) returns (ConfigureEngineResponse);
  rpc GetHostCapabilities(GetHostCapabilitiesRequest) returns (HostCapabilities);
}

service VMService {
  rpc CreateVM(CreateVMRequest) returns (CreateVMResponse);
  rpc StartVM(StartVMRequest) returns (StartVMResponse);
  rpc StopVM(StopVMRequest) returns (StopVMResponse);
  // Define other RPCs: DeleteVM, PauseVM, ResumeVM, GetVMStatus, UpdateVMConfiguration, ListVMs, ManageVMMedia
  rpc HotPlugVCPU(HotPlugVCPURequest) returns (HotPlugVCPUResponse);
  rpc HotUnplugVCPU(HotUnplugVCPURequest) returns (HotUnplugVCPUResponse);
  rpc HotAddMemory(HotAddMemoryRequest) returns (HotAddMemoryResponse);
  rpc HotRemoveMemory(HotRemoveMemoryRequest) returns (HotRemoveMemoryResponse);
}
