syntax = "proto3";

package proto;

option go_package = "./;proto";

enum VirtualHardwareArch {
  ARCH_UNSPECIFIED = 0;
  X86_64 = 1;
  ARM64 = 2;
}

message DiskImage {
  string path = 1;
  string format = 2;
  bool read_only = 3;
  // string disk_id = 4; // Re-adding disk_id as it's useful for boot_order
}

message NetworkInterface {
  string nic_id = 1; // Unique within the VM, e.g., "net0"
  string type = 2; // e.g., "virtio-net" (model)
  string mac_address = 3;
  string bridge_name = 4; // Host bridge to attach to, or network name
  // string network_attachment_id = 4; // More generic from finalized version
}

message SerialPortConfig {
  string id = 1; // e.g., "serial0", "com1"
  enum SerialPortType {
    SERIAL_TYPE_UNSPECIFIED = 0;
    LOG_ONLY = 1;    // Conceptual: Logs to VMM log, no host device
    STDIO = 2;       // Connect to VMM's stdio streams
    FILE = 3;        // Output to/input from a host file
    PTY = 4;         // Use a pseudo-terminal on the host
    TCP_SOCKET_SERVER = 5;
    TCP_SOCKET_CLIENT = 6;
    NAMED_PIPE = 7;
    NONE = 8;        // Explicitly no device
  }
  SerialPortType type = 2;
  string path_or_address = 3; // Path for FILE/PTY/NAMED_PIPE, "host:port" for TCP
  uint32 io_base_override = 4; // Optional: Override default I/O port (e.g., 0x3F8)
  // uint32 irq = 5; // Optional IRQ override - keep out for now for simplicity
}

message VCPUConfig {
  bool enable_kvm_hv = 1;
  uint32 count = 2; // Moved from VMConfig top level for clarity
  message Topology {
    uint32 sockets = 1;
    uint32 cores_per_socket = 2;
    uint32 threads_per_core = 3;
  }
  Topology topology = 3;
  repeated string cpu_features_to_enable = 4;
}

message MemoryConfig {
  uint64 size_mb = 1; // Moved from VMConfig top level
  bool enable_huge_pages = 2;
  bool enable_mem_ballooning = 3;
  message AIOptimizedFlags {
    bool prefer_contiguous_host_memory = 1;
    uint32 numa_node_affinity = 2;
  }
  AIOptimizedFlags ai_optimized_flags = 4;
}

message AIHardwareConfig {
  bool enable_ai_cpu = 1;
  bool enable_ai_gpu = 2;
  // More detailed AICPUConfig and AIGraphicsCardConfig can be added later
}

message GraphicsConfig {
 enum GraphicsType {
    GRAPHICS_TYPE_UNSPECIFIED = 0;
    NONE = 1;
    VGA_COMPATIBLE = 2;
    VIRTIO_GPU = 3;
    GPU_PASSTHROUGH = 4;
    MEDIATED_VGPU = 5;
  }
  GraphicsType type = 1;
  string vgpu_profile_or_physical_id = 2;
}

message PCIPassthroughDevice {
     string host_pci_address = 1;
     string iommu_group_path = 2;
}


// Main VM Configuration message
message VMConfig {
  string vm_id = 1;
  string name = 2;
  // uint32 vcpu_cores = 3; // Moved to VCPUConfig
  // uint64 memory_mb = 4; // Moved to MemoryConfig

  repeated DiskImage disk_images = 5;
  repeated NetworkInterface network_interfaces = 6;
  repeated SerialPortConfig serial_ports = 7;

  // bool enable_bios_boot = 8;   // Replaced by firmware_type
  string kernel_image_path = 9;
  string initrd_path = 10;
  string kernel_cmdline = 11;

  VirtualHardwareArch arch = 12;

  VCPUConfig vcpu_config = 13;       // Now includes count
  MemoryConfig memory_config = 14;   // Now includes size_mb
  AIHardwareConfig ai_hardware_config = 15;
  GraphicsConfig graphics_config = 19; // Number changed to avoid collision if fields were added and removed

  map<string, string> metadata = 16;
  repeated string boot_order = 20; // List of DiskImage.disk_id or NetworkInterface.nic_id

  enum FirmwareType { FIRMWARE_TYPE_UNSPECIFIED = 0; BIOS = 1; UEFI = 2; }
  FirmwareType firmware_type = 21;
  bool secure_boot_enabled = 22;
  bool virtual_tpm_enabled = 23;
  repeated PCIPassthroughDevice pci_passthrough_devices = 24;
  // AIAcceleratedHardware from finalized proto would go here too.
}

// --- gRPC Service Definitions ---

message CreateVMRequest {
  VMConfig config = 1;
  string vm_id_suggestion = 2;
}

message CreateVMResponse {
  string vm_id = 1;
  bool success = 2;
  string message = 3;
}

message StartVMRequest {
  string vm_id = 1;
  // Boot parameters moved to VMConfig for persistence and clarity
}

message StartVMResponse {
  bool success = 1;
  string message = 2;
}

message StopVMRequest {
  string vm_id = 1;
  bool force = 2;
  uint32 timeout_seconds = 3;
}

message StopVMResponse {
  bool success = 1;
  string message = 2;
}

// Adding other messages from finalized proto for completeness
message GetEngineInfoRequest {}
message GetEngineInfoResponse {
    string engine_version = 1;
    string api_version = 2;
    repeated string supported_vm_architectures = 3;
}
message HealthCheckRequest {}
message HealthCheckResponse {
    enum Status { UNKNOWN = 0; HEALTHY = 1; DEGRADED = 2; UNHEALTHY = 3; }
    Status status = 1;
    string message = 2;
}
message ConfigureEngineRequest {
    string log_level = 1;
    string default_storage_path = 2;
}
message ConfigureEngineResponse {
    bool success = 1;
    string message = 2;
}
message GetHostCapabilitiesRequest {}
message HostCapabilities {
    message CPUInfo {
        string model_string = 1;
        uint32 core_count = 2;
        uint32 thread_count = 3;
        repeated string supported_virtualization_extensions = 4;
    }
    CPUInfo cpu_info = 1;
    uint64 total_memory_gb = 2;
    uint64 available_memory_gb = 3;
    message StoragePoolInfo {
        string pool_id = 1;
        string path = 2;
        uint64 total_space_gb = 3;
        uint64 available_space_gb = 4;
    }
    repeated StoragePoolInfo storage_pools = 4;
    message GPUInfo {
        string gpu_id = 1;
        string vendor_id = 2;
        string device_id = 3;
        string model_name = 4;
        uint64 memory_mb = 5;
        bool passthrough_capable = 6;
        bool available_for_passthrough = 7;
        repeated string vgpu_profiles_supported = 8;
    }
    repeated GPUInfo detected_gpus = 5;
    message AIAcceleratorInfo {
        string accelerator_id = 1;
        string vendor_id = 2;
        string device_id = 3;
        string type = 4;
        string model_name = 5;
        bool passthrough_capable = 6;
        bool available_for_passthrough = 7;
        repeated string mediated_profiles_supported = 8;
    }
    repeated AIAcceleratorInfo detected_ai_accelerators = 6;
    repeated string kvm_capabilities_present = 7;
}

// --- Services ---
service CoreHypervisorService {
  rpc CreateVM(CreateVMRequest) returns (CreateVMResponse);
  rpc GetEngineInfo(GetEngineInfoRequest) returns (GetEngineInfoResponse);
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
  rpc ConfigureEngine(ConfigureEngineRequest) returns (ConfigureEngineResponse);
  rpc GetHostCapabilities(GetHostCapabilitiesRequest) returns (HostCapabilities);
}

service VMService {
  rpc StartVM(StartVMRequest) returns (StartVMResponse);
  rpc StopVM(StopVMRequest) returns (StopVMResponse);
  // Add other VM-specific RPCs from finalized version:
  // PauseVM, ResumeVM, DeleteVM, GetVMStatus, UpdateVMConfiguration, ListVMs, ManageVMMedia
  // HotPlugVCPU, HotUnplugVCPU, HotAddMemory, HotRemoveMemory
}
